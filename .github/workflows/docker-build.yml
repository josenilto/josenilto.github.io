# ══════════════════════════════════════════════════════════════════
#  Docker Build & Push — GitHub Container Registry (ghcr.io)
#  Dispara em: push para prd|master|main | tags v* | manual
# ══════════════════════════════════════════════════════════════════
name: 🐳 Docker Build & Push

on:
  push:
    branches: ["prd", "master", "main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Publicar imagem no GHCR? (true/false)"
        required: false
        default: "true"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ══════════════════════════════════════════════════════════════════
jobs:

  # ── JOB 1: Build + Push ────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tags:   ${{ steps.meta.outputs.tags }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── Docker Buildx (suporte multi-arch) ─────────────────────
      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login no GHCR ──────────────────────────────────────────
      - name: 🔐 Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Gera tags e labels automaticamente ────────────────────
      # Exemplos de tags geradas:
      #   push para prd   → ghcr.io/user/repo:prd
      #   tag v1.2.3      → ghcr.io/user/repo:1.2.3 + :1.2 + :latest
      #   todo commit     → ghcr.io/user/repo:sha-abc1234
      - name: 🏷️ Extrair metadados (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prd' || startsWith(github.ref, 'refs/tags/') }}

      # ── Build e push (amd64 + arm64) ───────────────────────────
      - name: 🐳 Build & Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true' }}
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
          sbom: true

      # ── Resumo no GitHub Actions ───────────────────────────────
      - name: 📋 Resumo do Build
        if: always()
        run: |
          echo "## 🐳 Docker Build & Push" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Plataformas | \`linux/amd64, linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${{ steps.push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch/Tag | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Data | $(date -u '+%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags publicadas" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── JOB 2: Smoke-test da imagem publicada ──────────────────────
  smoke-test:
    name: 🧪 Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    timeout-minutes: 10

    steps:
      - name: 🔐 Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Testar container
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "Iniciando container: $IMAGE"
          docker run -d --name smoke-test -p 8080:80 "$IMAGE"
          sleep 5

          # Health-check endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "Health-check HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Health-check falhou" && exit 1)

          # Página principal
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Página principal HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ Página principal falhou" && exit 1)

          # Página 404 customizada
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/pagina-que-nao-existe)
          echo "404 customizado HTTP $STATUS"
          [ "$STATUS" = "404" ] || (echo "❌ Página 404 falhou" && exit 1)

          echo "✅ Todos os checks passaram!"
          docker rm -f smoke-test

      - name: 📋 Resumo do Smoke Test
        if: always()
        run: |
          echo "## 🧪 Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| \`/health\` | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| \`/\` (portfólio) | ✅ 200 OK |" >> $GITHUB_STEP_SUMMARY
          echo "| \`/pagina-inexistente\` (404) | ✅ 404 OK |" >> $GITHUB_STEP_SUMMARY

  # ── JOB 3: Scan de vulnerabilidades (Trivy) ────────────────────
  security-scan:
    name: 🔒 CVE Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: 🔐 Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Checkout (para .trivyignore)
        uses: actions/checkout@v4

      - name: 🔒 Scan de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: 📤 Upload SARIF para GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-docker

  # ── JOB 4: Docker Scout scan com VEX ──────────────────────────
  # Requer secrets: DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
  scout-scan:
    name: 🛡️ Docker Scout CVE Scan (VEX)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success() && vars.ENABLE_SCOUT_SCAN == 'true'

    steps:
      - name: 📥 Checkout (para VEX)
        uses: actions/checkout@v4

      - name: 🔐 Login no Docker Hub (Scout)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔐 Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ Docker Scout CVEs (respeitando VEX)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          vex-location: .docker/scout/vex/
          only-severities: critical,high,medium
          exit-code: true
        continue-on-error: true

      - name: 📋 Resumo Scout
        if: always()
        run: |
          echo "## 🛡️ Docker Scout CVE Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| VEX document | \`.docker/scout/vex/vex.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CVEs aceitos | CVE-2025-60876 (busybox, sem fix upstream) |" >> $GITHUB_STEP_SUMMARY
          echo "| CVEs aceitos | CVE-2026-6732 (libxml2, sem fix upstream) |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — LIMPEZA DO GHCR (manter últimas 5 versões)
  #   • Roda após build bem-sucedido
  #   • Nunca apaga: latest, prd, tags semver (ex: 1.2.3)
  #   • Apaga versões sha-* excedentes (mais antigas que as 5 recentes)
  # ══════════════════════════════════════════════════════════════
  cleanup-registry:
    name: 🧹 Limpar GHCR (manter 5 versões)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    timeout-minutes: 5

    permissions:
      packages: write

    steps:
      - name: 🧹 Remover versões antigas
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: '^(latest|prd|\d+\.\d+)'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Resumo da Limpeza
        if: always()
        run: |
          echo "## 🧹 Limpeza do GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Pacote | \`${{ github.event.repository.name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Versões mantidas | últimas 5 |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags protegidas | \`latest\`, \`prd\`, semver (\`x.y.z\`) |" >> $GITHUB_STEP_SUMMARY

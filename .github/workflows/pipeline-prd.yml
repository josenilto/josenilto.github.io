# ══════════════════════════════════════════════════════════════════
#  Pipeline PRD — Adaptativo: React (Lovable) ou Site Estático
#  Dispara em: push/PR para prd|master|main  |  manual (dispatch)
#
#  Detecção automática de tipo de projeto:
#    package.json com vite → React (Lovable) → vite build --base /
#    sem package.json      → Estático         → copia arquivos locais
#
#  URL: https://josenilto.github.io/
# ══════════════════════════════════════════════════════════════════
name: 🚀 Pipeline PRD — Testes & Deploy

on:
  push:
    branches: ["prd", "master", "main"]
  pull_request:
    branches: ["prd", "master", "main"]
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: "Pular verificação de links? (true/false)"
        required: false
        default: "false"

concurrency:
  group: pipeline-prd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Menor privilégio: só leitura por padrão; jobs que publicam pedem escrita.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LINKINATOR_VERSION: "8.1.0"
  SITE_URL: "https://josenilto.github.io"

# ══════════════════════════════════════════════════════════════════
# JOB 1 — DETECTAR TIPO DE PROJETO
# ══════════════════════════════════════════════════════════════════
jobs:
  detect:
    name: 🔍 Detectar tipo de projeto
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.probe.outputs.type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 🔍 Verificar tipo (React/Vite ou Estático)
        id: probe
        run: |
          if [ -f "package.json" ] && grep -q '"vite"' package.json 2>/dev/null; then
            echo "type=react" >> "$GITHUB_OUTPUT"
            echo "🟦 Projeto React/Vite detectado — build com Vite"
          else
            echo "type=static" >> "$GITHUB_OUTPUT"
            echo "🟩 Projeto estático detectado — publica arquivos locais"
          fi

  # ══════════════════════════════════════════════════════════════
  # JOB 2a — BUILD REACT (Lovable/Vite)
  # ══════════════════════════════════════════════════════════════
  build-react:
    name: 🔨 Build React (base /)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.type == 'react'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps --no-audit

      - name: 🔒 Auditoria de segurança
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🧹 Lint (ESLint)
        run: npm run lint

      - name: 🏗️ Build produção (base /)
        run: npm run build -- --base /

      - name: 📊 Tamanho do build
        run: |
          echo "## 🏗️ Build React — PRD" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Modo | \`production\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Base path | \`/\` (raiz) |" >> $GITHUB_STEP_SUMMARY
          echo "| Tamanho | $(du -sh dist/ | cut -f1) |" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload artefato
        uses: actions/upload-artifact@v7
        with:
          name: dist-prd
          path: dist/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # JOB 2b — VERIFICAÇÃO DE LINKS (Estático)
  # ══════════════════════════════════════════════════════════════
  link-check:
    name: 🔗 Verificação de Links
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.type == 'static' && github.event.inputs.skip_link_check != 'true'
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Verifica links internos (inclusive https://josenilto.github.io/...),
      # âncoras #id e url() dos CSS em todas as páginas (EN e PT).
      - name: 🔗 Links locais
        id: local
        run: node .github/scripts/check-links.mjs .

      - name: 🌐 Links externos (aviso)
        id: external
        run: |
          npx --yes linkinator@${{ env.LINKINATOR_VERSION }} . \
            --recurse \
            --skip "josenilto\.github\.io|linkedin\.com|api\.whatsapp\.com|josenilto\.slack\.com|web\.telegram\.org|unpkg\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com" \
            --timeout 15000 \
            --retry-errors \
            --verbosity error
        continue-on-error: true

      - name: 📄 Resumo de links
        if: always()
        run: |
          echo "## 🔗 Verificação de Links — PRD (estático)" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Links locais | ${{ steps.local.outcome == 'success' && '✅ OK' || '❌ Falhou' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links externos | ${{ steps.external.outcome == 'success' && '✅ OK' || '⚠️ Avisos' }} |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — DEPLOY PARA GITHUB PAGES (PRD)
  # ══════════════════════════════════════════════════════════════
  deploy-prd:
    name: 🌐 Deploy GitHub Pages (PRD)
    runs-on: ubuntu-latest
    needs: [detect, build-react, link-check]
    timeout-minutes: 10
    if: |
      always() &&
      (
        (needs.detect.outputs.type == 'react'  && needs.build-react.result == 'success') ||
        (needs.detect.outputs.type == 'static' && (needs.link-check.result == 'success' || needs.link-check.result == 'skipped'))
      ) &&
      (
        github.ref == 'refs/heads/prd'    ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main'   ||
        github.event_name == 'workflow_dispatch'
      )

    environment:
      name: prd
      url: https://josenilto.github.io

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # ── Caminho React ──────────────────────────────────────────
      - name: 📥 Download artefato React
        if: needs.detect.outputs.type == 'react'
        uses: actions/download-artifact@v8
        with:
          name: dist-prd
          path: dist/

      - name: 📁 Preparar publicação React
        if: needs.detect.outputs.type == 'react'
        run: |
          echo "📂 Build React a publicar na raiz:"
          find dist/ -maxdepth 2 -type f | head -20

      # ── Caminho Estático ───────────────────────────────────────
      - name: 📁 Preparar publicação Estática
        if: needs.detect.outputs.type == 'static'
        # copia os arquivos, minifica CSS/JS e grava version.json
        run: bash .github/scripts/build-static.sh _site

      # ── Deploy unificado ───────────────────────────────────────
      - name: 🚀 Deploy → / (raiz · gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ${{ needs.detect.outputs.type == 'react' && './dist' || './_site' }}
          destination_dir: .
          keep_files:      true
          enable_jekyll:   false
          commit_message:  "deploy(prd): ${{ github.sha }} by @${{ github.actor }}"
          user_name:  "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: 📋 Resumo do Deploy
        run: |
          echo "## 🚀 Deploy PRD Concluído! (${{ needs.detect.outputs.type }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | [https://josenilto.github.io](https://josenilto.github.io) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Tipo | \`${{ needs.detect.outputs.type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Autor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Data | $(date -u '+%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — HEALTH CHECK PÓS-DEPLOY
  # ══════════════════════════════════════════════════════════════
  health-check:
    name: 🏥 Health Check Pós-Deploy
    runs-on: ubuntu-latest
    needs: [detect, deploy-prd]
    # always(): sem ele o job era pulado sempre que build-react era "skipped"
    # (site estático) — e o rollback automático nunca rodava.
    if: always() && needs.deploy-prd.result == 'success'
    timeout-minutes: 12
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}

    steps:
      - name: 🔍 Aguardar a nova versão e verificar páginas
        id: check
        env:
          TYPE: ${{ needs.detect.outputs.type }}
        run: |
          HEALTHY=false
          # 1) Estático: espera o GitHub Pages servir o version.json deste commit
          #    (em vez de um sleep fixo) — confirma que o deploy chegou ao ar.
          if [ "$TYPE" = "static" ]; then
            for i in $(seq 1 30); do
              LIVE=$(curl -fsS --max-time 10 "${SITE_URL}/version.json?t=$(date +%s)" 2>/dev/null \
                     | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p' || true)
              echo "🔄 ${i}/30 → versão no ar: ${LIVE:-—}"
              [ "$LIVE" = "$GITHUB_SHA" ] && break
              sleep 15
            done
            if [ "$LIVE" != "$GITHUB_SHA" ]; then
              echo "::warning title=Propagação lenta::version.json ainda não mostra ${GITHUB_SHA::7} — verificando as páginas mesmo assim"
            fi
            PATHS="/ /pt/ /health /version.json"
          else
            sleep 45
            PATHS="/"
          fi

          # 2) Cada página precisa responder HTTP 200 (até 5 tentativas)
          FAIL=0
          for P in $PATHS; do
            OK=false
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "${SITE_URL}${P}" || echo "000")
              echo "   ${P} → HTTP ${STATUS} (tentativa ${i})"
              [ "$STATUS" = "200" ] && OK=true && break
              sleep 10
            done
            echo "| \`${P}\` | $([ "$OK" = true ] && echo '✅ 200' || echo "❌ ${STATUS}") |" >> /tmp/health.md
            [ "$OK" = true ] || FAIL=1
          done

          [ "$FAIL" = 0 ] && HEALTHY=true
          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          if [ "$HEALTHY" = "false" ]; then
            echo "❌ Health check falhou — acionando rollback"
            exit 1
          fi
          echo "✅ Site saudável"

      - name: 📋 Resumo
        if: always()
        run: |
          {
            echo "## 🏥 Health Check Pós-Deploy"
            echo "| Página | Status |"
            echo "| --- | --- |"
            cat /tmp/health.md 2>/dev/null || true
            echo ""
            if [ "${{ steps.check.outputs.healthy }}" = "true" ]; then
              echo "✅ **Site no ar com o commit \`${GITHUB_SHA::7}\`**"
            else
              echo "❌ **Site não respondeu — rollback acionado**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — AUTO-ROLLBACK
  # ══════════════════════════════════════════════════════════════
  auto-rollback:
    name: 🔄 Auto-Rollback
    runs-on: ubuntu-latest
    needs: [deploy-prd, health-check]
    if: always() && needs.health-check.result == 'failure'
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      rolled_back:  ${{ steps.rollback.outputs.rolled_back }}
      previous_sha: ${{ steps.rollback.outputs.previous_sha }}

    steps:
      - name: 📥 Checkout branch gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 5
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Reverter último deploy
        id: rollback
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "📋 Últimos deploys no gh-pages:"
          git log --oneline -5
          PREV_SHA=$(git log --format="%H" | sed -n '2p')
          PREV_SHORT="${PREV_SHA:0:7}"
          echo "🎯 Revertendo para: ${PREV_SHORT}"
          git revert --no-edit HEAD
          git push origin gh-pages
          echo "rolled_back=true"          >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREV_SHORT}" >> "$GITHUB_OUTPUT"
          echo "✅ Rollback concluído — site restaurado para ${PREV_SHORT}"

      - name: 📋 Resumo do Rollback
        if: always()
        run: |
          echo "## 🔄 Auto-Rollback Executado" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Health check falhou — site revertido automaticamente.**" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit revertido | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔙 Restaurado para  | \`${{ steps.rollback.outputs.previous_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Data/Hora        | $(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M (BRT)') |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 6 — NOTIFICAÇÃO POR E-MAIL
  # ══════════════════════════════════════════════════════════════
  notify-email:
    name: 📧 Notificação por E-mail
    runs-on: ubuntu-latest
    needs: [detect, link-check, build-react, deploy-prd, health-check, auto-rollback]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🎨 Gerar template HTML
        id: gen_html
        run: |
          DEPLOY_RESULT="${{ needs.deploy-prd.result }}"
          HEALTH_RESULT="${{ needs.health-check.result }}"
          ROLLBACK_RESULT="${{ needs.auto-rollback.result }}"
          TYPE="${{ needs.detect.outputs.type }}"
          BUILD_RESULT="${{ needs.build-react.result == 'skipped' && needs.link-check.result || needs.build-react.result }}"

          if [ "$ROLLBACK_RESULT" = "success" ]; then
            STATUS_ICON="🔄"; STATUS_BG="#fff3e0"; STATUS_BORDER="#ff9800"
            STATUS_TEXT="#e65100"; STATUS_LABEL="Rollback Automático Executado"; SUBJECT_EMOJI="🔄"
          elif [ "$DEPLOY_RESULT" = "success" ] && [ "$HEALTH_RESULT" = "success" ]; then
            STATUS_ICON="✅"; STATUS_BG="#e8f5e9"; STATUS_BORDER="#4caf50"
            STATUS_TEXT="#1b5e20"; STATUS_LABEL="Deploy PRD Concluído com Sucesso (${TYPE})"; SUBJECT_EMOJI="✅"
          elif [ "$HEALTH_RESULT" = "failure" ]; then
            STATUS_ICON="⚠️"; STATUS_BG="#fff3e0"; STATUS_BORDER="#ff9800"
            STATUS_TEXT="#e65100"; STATUS_LABEL="Health Check Falhou — Rollback em Progresso"; SUBJECT_EMOJI="⚠️"
          else
            STATUS_ICON="❌"; STATUS_BG="#ffebee"; STATUS_BORDER="#ef5350"
            STATUS_TEXT="#b71c1c"; STATUS_LABEL="Falha no Deploy PRD — Ação Necessária"; SUBJECT_EMOJI="❌"
          fi
          echo "subject_emoji=${SUBJECT_EMOJI}" >> "$GITHUB_OUTPUT"

          case "$BUILD_RESULT" in
            success)   JOB1_ICON="✅"; JOB1_LABEL="Sucesso";   JOB1_BORDER="#4caf50"; JOB1_BADGE_BG="#e8f5e9"; JOB1_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB1_ICON="❌"; JOB1_LABEL="Falhou";    JOB1_BORDER="#ef5350"; JOB1_BADGE_BG="#ffebee"; JOB1_BADGE_COLOR="#c62828" ;;
            skipped)   JOB1_ICON="⊘";  JOB1_LABEL="Pulado";    JOB1_BORDER="#bdbdbd"; JOB1_BADGE_BG="#f5f5f5"; JOB1_BADGE_COLOR="#757575" ;;
            cancelled) JOB1_ICON="⊘";  JOB1_LABEL="Cancelado"; JOB1_BORDER="#ff9800"; JOB1_BADGE_BG="#fff3e0"; JOB1_BADGE_COLOR="#e65100" ;;
            *)         JOB1_ICON="⊘";  JOB1_LABEL="—";         JOB1_BORDER="#bdbdbd"; JOB1_BADGE_BG="#f5f5f5"; JOB1_BADGE_COLOR="#9e9e9e" ;;
          esac
          case "$DEPLOY_RESULT" in
            success)   JOB2_ICON="✅"; JOB2_LABEL="Sucesso";   JOB2_BORDER="#4caf50"; JOB2_BADGE_BG="#e8f5e9"; JOB2_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB2_ICON="❌"; JOB2_LABEL="Falhou";    JOB2_BORDER="#ef5350"; JOB2_BADGE_BG="#ffebee"; JOB2_BADGE_COLOR="#c62828" ;;
            skipped)   JOB2_ICON="⊘";  JOB2_LABEL="Pulado";    JOB2_BORDER="#bdbdbd"; JOB2_BADGE_BG="#f5f5f5"; JOB2_BADGE_COLOR="#757575" ;;
            cancelled) JOB2_ICON="⊘";  JOB2_LABEL="Cancelado"; JOB2_BORDER="#ff9800"; JOB2_BADGE_BG="#fff3e0"; JOB2_BADGE_COLOR="#e65100" ;;
            *)         JOB2_ICON="⊘";  JOB2_LABEL="—";         JOB2_BORDER="#bdbdbd"; JOB2_BADGE_BG="#f5f5f5"; JOB2_BADGE_COLOR="#9e9e9e" ;;
          esac
          case "$HEALTH_RESULT" in
            success)   JOB3_ICON="✅"; JOB3_LABEL="Saudável";  JOB3_BORDER="#4caf50"; JOB3_BADGE_BG="#e8f5e9"; JOB3_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB3_ICON="❌"; JOB3_LABEL="Falhou";    JOB3_BORDER="#ef5350"; JOB3_BADGE_BG="#ffebee"; JOB3_BADGE_COLOR="#c62828" ;;
            skipped)   JOB3_ICON="⊘";  JOB3_LABEL="Pulado";    JOB3_BORDER="#bdbdbd"; JOB3_BADGE_BG="#f5f5f5"; JOB3_BADGE_COLOR="#757575" ;;
            *)         JOB3_ICON="⊘";  JOB3_LABEL="—";         JOB3_BORDER="#bdbdbd"; JOB3_BADGE_BG="#f5f5f5"; JOB3_BADGE_COLOR="#9e9e9e" ;;
          esac

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M (BRT)')
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_NUM="#${{ github.run_number }}"

          sed \
            -e "s|{{PIPELINE_TITLE}}|Pipeline PRD (${TYPE})|g" \
            -e "s|{{ENV_LABEL}}|josenilto.github.io · PRD|g" \
            -e "s|{{ENV_URL}}|https://josenilto.github.io|g" \
            -e "s|{{ENV_BTN_LABEL}}|Ver Site em Produção|g" \
            -e "s|{{JOB1_NAME}}|🔨\&nbsp; Build / Link Check|g" \
            -e "s|{{JOB2_NAME}}|🚀\&nbsp; Deploy GitHub Pages|g" \
            -e "s|{{JOB3_NAME}}|🏥\&nbsp; Health Check Pós-Deploy|g" \
            -e "s|{{STATUS_ICON}}|${STATUS_ICON}|g" \
            -e "s|{{STATUS_BG}}|${STATUS_BG}|g" \
            -e "s|{{STATUS_BORDER}}|${STATUS_BORDER}|g" \
            -e "s|{{STATUS_TEXT}}|${STATUS_TEXT}|g" \
            -e "s|{{STATUS_LABEL}}|${STATUS_LABEL}|g" \
            -e "s|{{JOB1_ICON}}|${JOB1_ICON}|g" \
            -e "s|{{JOB1_LABEL}}|${JOB1_LABEL}|g" \
            -e "s|{{JOB1_BORDER}}|${JOB1_BORDER}|g" \
            -e "s|{{JOB1_BADGE_BG}}|${JOB1_BADGE_BG}|g" \
            -e "s|{{JOB1_BADGE_COLOR}}|${JOB1_BADGE_COLOR}|g" \
            -e "s|{{JOB2_ICON}}|${JOB2_ICON}|g" \
            -e "s|{{JOB2_LABEL}}|${JOB2_LABEL}|g" \
            -e "s|{{JOB2_BORDER}}|${JOB2_BORDER}|g" \
            -e "s|{{JOB2_BADGE_BG}}|${JOB2_BADGE_BG}|g" \
            -e "s|{{JOB2_BADGE_COLOR}}|${JOB2_BADGE_COLOR}|g" \
            -e "s|{{JOB3_ICON}}|${JOB3_ICON}|g" \
            -e "s|{{JOB3_LABEL}}|${JOB3_LABEL}|g" \
            -e "s|{{JOB3_BORDER}}|${JOB3_BORDER}|g" \
            -e "s|{{JOB3_BADGE_BG}}|${JOB3_BADGE_BG}|g" \
            -e "s|{{JOB3_BADGE_COLOR}}|${JOB3_BADGE_COLOR}|g" \
            -e "s|{{BRANCH}}|${{ github.ref_name }}|g" \
            -e "s|{{SHORT_SHA}}|${SHORT_SHA}|g" \
            -e "s|{{ACTOR}}|${{ github.actor }}|g" \
            -e "s|{{TIMESTAMP}}|${TIMESTAMP}|g" \
            -e "s|{{WORKFLOW_RUN}}|${RUN_NUM}|g" \
            -e "s|{{WORKFLOW_URL}}|${WORKFLOW_URL}|g" \
            .github/email-templates/deploy-notification.html > /tmp/email-body.html

          { echo 'html_body<<EMAILEOF'; cat /tmp/email-body.html; echo 'EMAILEOF'; } >> "$GITHUB_OUTPUT"

      - name: 📬 Enviar e-mail
        id: send_mail
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.gen_html.outputs.subject_emoji }} Deploy PRD · ${{ github.ref_name }} · #${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions Bot <${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}>"
          html_body: ${{ steps.gen_html.outputs.html_body }}
          convert_markdown: false

      # O envio usa continue-on-error (e-mail não deve derrubar o deploy),
      # então a falha é sinalizada aqui como aviso + resumo do job.
      - name: ⚠️ Falha no envio do e-mail
        if: steps.send_mail.outcome == 'failure'
        run: |
          echo "::warning title=E-mail não enviado::Falha no SMTP — verifique os secrets MAIL_SERVER, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM e MAIL_TO."
          {
            echo "## ⚠️ Notificação por e-mail não enviada"
            echo ""
            echo "O servidor SMTP recusou o envio (veja o log do passo **📬 Enviar e-mail**)."
            echo "Contas Outlook.com/Hotmail não aceitam mais login SMTP por senha;"
            echo "use Gmail com senha de app ou um provedor SMTP (ex.: Brevo). Veja o readme."
          } >> "$GITHUB_STEP_SUMMARY"

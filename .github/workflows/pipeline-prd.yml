# ══════════════════════════════════════════════════════════════════
#  Pipeline PRD — Verificação de links e Deploy para GitHub Pages
#  Projeto: portfólio estático (HTML/CSS/JS) — sem build Node/React
#  Dispara em: push/PR para prd|master|main  |  manual (dispatch)
# ══════════════════════════════════════════════════════════════════
name: 🚀 Pipeline PRD — Testes & Deploy

on:
  push:
    branches: ["prd", "master", "main"]
  pull_request:
    branches: ["prd", "master", "main"]
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: "Pular verificação de links? (true/false)"
        required: false
        default: "false"

# Impede deploys simultâneos — cancela o anterior se novo push chegar em PR
concurrency:
  group: pipeline-prd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ══════════════════════════════════════════════════════════════════
# JOB 1 — VERIFICAÇÃO DE LINKS
#   • Verifica links locais do index.html (assets, CSS, JS)
#   • Links locais quebrados → bloqueiam o deploy
#   • Links externos         → aviso apenas (continue-on-error)
# ══════════════════════════════════════════════════════════════════
jobs:
  link-check:
    name: 🔗 Verificação de Links
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_link_check != 'true'
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Instalar linkinator
        run: npm install -g linkinator

      # ── Links locais — falha se quebrado ──────────────────────
      - name: 🔗 Links locais
        id: local
        run: |
          linkinator ./index.html \
            --skip "^https?://" \
            --timeout 10000 \
            --verbosity error \
            --format json \
            --output link-local.json 2>/dev/null || true

          node -e "
            const fs = require('fs');
            try {
              const data = fs.readFileSync('./link-local.json', 'utf8');
              const lines = data.trim().split('\n').filter(Boolean);
              const broken = [];
              lines.forEach(line => {
                try {
                  const obj = JSON.parse(line);
                  if (obj.links) obj.links.forEach(l => { if (l.state === 'BROKEN') broken.push(l); });
                  else if (obj.state === 'BROKEN') broken.push(obj);
                } catch(e) {}
              });
              if (broken.length > 0) {
                console.error('❌ Links locais quebrados:');
                broken.forEach(l => console.error('  •', l.url || l.href, '-', l.status || l.statusCode));
                process.exit(1);
              }
              console.log('✅ Todos os links locais estão OK!');
            } catch(e) {
              console.log('⚠️  Relatório não gerado, pulando verificação.');
            }
          "

      # ── Links externos — aviso apenas ────────────────────────
      - name: 🌐 Links externos (aviso)
        id: external
        run: |
          linkinator ./index.html \
            --recurse \
            --skip "api\.whatsapp\.com|josenilto\.slack\.com|web\.telegram\.org|unpkg\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com" \
            --timeout 15000 \
            --retry-errors \
            --verbosity error \
            || echo "⚠️ Alguns links externos podem estar temporariamente indisponíveis"
        continue-on-error: true

      - name: 📄 Resumo de links
        if: always()
        run: |
          echo "## 🔗 Verificação de Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Links locais | ${{ steps.local.outcome == 'success' && '✅ OK' || '❌ Falhou' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links externos | ${{ steps.external.outcome == 'success' && '✅ OK' || '⚠️ Avisos' }} |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — DEPLOY PARA GITHUB PAGES (PRD)
  #   • Só roda em push/dispatch para prd|master|main
  #   • Publica: index.html + 404.html + assets/
  # ══════════════════════════════════════════════════════════════
  deploy-prd:
    name: 🌐 Deploy GitHub Pages (PRD)
    runs-on: ubuntu-latest
    needs: link-check
    timeout-minutes: 10
    if: |
      always() &&
      (needs.link-check.result == 'success' || needs.link-check.result == 'skipped') &&
      (
        github.ref == 'refs/heads/prd'    ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/main'   ||
        github.event_name == 'workflow_dispatch'
      )

    environment:
      name: prd
      url: https://josenilto.github.io

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Preparar pasta de publicação
        run: |
          mkdir -p _site

          cp *.html      _site/
          cp -r assets/  _site/assets/
          cp robots.txt  _site/
          cp sitemap.xml _site/
          cp health      _site/

          echo "📂 Estrutura de publicação:"
          find _site -maxdepth 2 -type f | sort

      - name: 🚀 Deploy → / (raiz · gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ./_site
          destination_dir: .
          keep_files:      true
          enable_jekyll:   false
          commit_message:  "deploy(prd): ${{ github.sha }} by @${{ github.actor }}"
          user_name:  "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: 📋 Resumo do Deploy
        run: |
          echo "## 🚀 Deploy PRD Concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | [https://josenilto.github.io](https://josenilto.github.io) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Autor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Data | $(date -u '+%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — HEALTH CHECK PÓS-DEPLOY
  #   • Aguarda propagação do GitHub Pages (60s)
  #   • Testa /health até 5 vezes com 20s de intervalo
  #   • Falha → aciona auto-rollback no job seguinte
  # ══════════════════════════════════════════════════════════════
  health-check:
    name: 🏥 Health Check Pós-Deploy
    runs-on: ubuntu-latest
    needs: deploy-prd
    if: needs.deploy-prd.result == 'success'
    timeout-minutes: 6
    outputs:
      healthy: ${{ steps.check.outputs.healthy }}

    steps:
      - name: ⏳ Aguardar propagação do GitHub Pages
        run: |
          echo "⏳ Aguardando 60s para o GitHub Pages propagar o deploy..."
          sleep 60

      - name: 🔍 Verificar endpoint /health
        id: check
        run: |
          URL="https://josenilto.github.io/health"
          HEALTHY=false
          for i in 1 2 3 4 5; do
            echo "🔄 Tentativa ${i}/5 → ${URL}"
            STATUS=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            echo "   HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true
              echo "✅ Health check OK na tentativa ${i}!"
              break
            fi
            [ "$i" -lt 5 ] && echo "   ⏳ Aguardando 20s..." && sleep 20
          done
          echo "healthy=${HEALTHY}" >> "$GITHUB_OUTPUT"
          if [ "$HEALTHY" = "false" ]; then
            echo "❌ Health check falhou após 5 tentativas — acionando rollback"
            exit 1
          fi

      - name: 📋 Resumo
        if: always()
        run: |
          echo "## 🏥 Health Check Pós-Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.healthy }}" = "true" ]; then
            echo "✅ **Endpoint /health respondeu HTTP 200**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Endpoint /health não respondeu — rollback acionado**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| URL verificada | \`https://josenilto.github.io/health\` |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — AUTO-ROLLBACK
  #   • Ativado apenas quando health-check falha
  #   • Reverte o último commit do branch gh-pages
  #   • Restaura o site para o estado anterior ao deploy
  # ══════════════════════════════════════════════════════════════
  auto-rollback:
    name: 🔄 Auto-Rollback
    runs-on: ubuntu-latest
    needs: [deploy-prd, health-check]
    if: always() && needs.health-check.result == 'failure'
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      rolled_back:  ${{ steps.rollback.outputs.rolled_back }}
      previous_sha: ${{ steps.rollback.outputs.previous_sha }}

    steps:
      - name: 📥 Checkout branch gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 5
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Reverter último deploy
        id: rollback
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "📋 Últimos deploys no gh-pages:"
          git log --oneline -5

          PREV_SHA=$(git log --format="%H" | sed -n '2p')
          PREV_SHORT="${PREV_SHA:0:7}"
          echo "🎯 Revertendo para commit anterior: ${PREV_SHORT}"

          git revert --no-edit HEAD
          git push origin gh-pages

          echo "rolled_back=true"          >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREV_SHORT}" >> "$GITHUB_OUTPUT"
          echo "✅ Rollback concluído — site restaurado para ${PREV_SHORT}"

      - name: 📋 Resumo do Rollback
        if: always()
        run: |
          echo "## 🔄 Auto-Rollback Executado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Health check falhou — site revertido automaticamente.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit revertido | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔙 Restaurado para  | \`${{ steps.rollback.outputs.previous_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Data/Hora        | $(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M (BRT)') |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — NOTIFICAÇÃO POR E-MAIL
  #   • Envia e-mail HTML com visual do portfólio
  #   • Roda sempre — notifica sucesso E falha
  #   • Requer secrets: MAIL_SERVER, MAIL_PORT, MAIL_USERNAME,
  #                     MAIL_PASSWORD, MAIL_TO
  # ══════════════════════════════════════════════════════════════
  notify-email:
    name: 📧 Notificação por E-mail
    runs-on: ubuntu-latest
    needs: [link-check, deploy-prd, health-check, auto-rollback]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎨 Gerar template HTML
        id: gen_html
        run: |
          DEPLOY_RESULT="${{ needs.deploy-prd.result }}"
          LINK_RESULT="${{ needs.link-check.result }}"
          HEALTH_RESULT="${{ needs.health-check.result }}"
          ROLLBACK_RESULT="${{ needs.auto-rollback.result }}"

          # ── Status geral ──────────────────────────────────────
          if [ "$ROLLBACK_RESULT" = "success" ]; then
            STATUS_ICON="🔄"; STATUS_BG="#fff3e0"; STATUS_BORDER="#ff9800"
            STATUS_TEXT="#e65100"; STATUS_LABEL="Rollback Automático Executado"
            SUBJECT_EMOJI="🔄"
          elif [ "$DEPLOY_RESULT" = "success" ] && [ "$HEALTH_RESULT" = "success" ]; then
            STATUS_ICON="✅"; STATUS_BG="#e8f5e9"; STATUS_BORDER="#4caf50"
            STATUS_TEXT="#1b5e20"; STATUS_LABEL="Deploy Concluído com Sucesso"
            SUBJECT_EMOJI="✅"
          elif [ "$HEALTH_RESULT" = "failure" ]; then
            STATUS_ICON="⚠️"; STATUS_BG="#fff3e0"; STATUS_BORDER="#ff9800"
            STATUS_TEXT="#e65100"; STATUS_LABEL="Health Check Falhou — Rollback em Progresso"
            SUBJECT_EMOJI="⚠️"
          else
            STATUS_ICON="❌"; STATUS_BG="#ffebee"; STATUS_BORDER="#ef5350"
            STATUS_TEXT="#b71c1c"; STATUS_LABEL="Falha no Deploy — Ação Necessária"
            SUBJECT_EMOJI="❌"
          fi
          echo "subject_emoji=${SUBJECT_EMOJI}" >> "$GITHUB_OUTPUT"

          # ── Badge: Verificação de Links ───────────────────────
          case "$LINK_RESULT" in
            success)   JOB1_ICON="✅"; JOB1_LABEL="Sucesso";   JOB1_BORDER="#4caf50"; JOB1_BADGE_BG="#e8f5e9"; JOB1_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB1_ICON="❌"; JOB1_LABEL="Falhou";    JOB1_BORDER="#ef5350"; JOB1_BADGE_BG="#ffebee"; JOB1_BADGE_COLOR="#c62828" ;;
            skipped)   JOB1_ICON="⊘";  JOB1_LABEL="Pulado";    JOB1_BORDER="#bdbdbd"; JOB1_BADGE_BG="#f5f5f5"; JOB1_BADGE_COLOR="#757575" ;;
            cancelled) JOB1_ICON="⊘";  JOB1_LABEL="Cancelado"; JOB1_BORDER="#ff9800"; JOB1_BADGE_BG="#fff3e0"; JOB1_BADGE_COLOR="#e65100" ;;
            *)         JOB1_ICON="⊘";  JOB1_LABEL="—";         JOB1_BORDER="#bdbdbd"; JOB1_BADGE_BG="#f5f5f5"; JOB1_BADGE_COLOR="#9e9e9e" ;;
          esac

          # ── Badge: Deploy GitHub Pages ────────────────────────
          case "$DEPLOY_RESULT" in
            success)   JOB2_ICON="✅"; JOB2_LABEL="Sucesso";   JOB2_BORDER="#4caf50"; JOB2_BADGE_BG="#e8f5e9"; JOB2_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB2_ICON="❌"; JOB2_LABEL="Falhou";    JOB2_BORDER="#ef5350"; JOB2_BADGE_BG="#ffebee"; JOB2_BADGE_COLOR="#c62828" ;;
            skipped)   JOB2_ICON="⊘";  JOB2_LABEL="Pulado";    JOB2_BORDER="#bdbdbd"; JOB2_BADGE_BG="#f5f5f5"; JOB2_BADGE_COLOR="#757575" ;;
            cancelled) JOB2_ICON="⊘";  JOB2_LABEL="Cancelado"; JOB2_BORDER="#ff9800"; JOB2_BADGE_BG="#fff3e0"; JOB2_BADGE_COLOR="#e65100" ;;
            *)         JOB2_ICON="⊘";  JOB2_LABEL="—";         JOB2_BORDER="#bdbdbd"; JOB2_BADGE_BG="#f5f5f5"; JOB2_BADGE_COLOR="#9e9e9e" ;;
          esac

          # ── Badge: Health Check ───────────────────────────────
          case "$HEALTH_RESULT" in
            success)   JOB3_ICON="✅"; JOB3_LABEL="Saudável";  JOB3_BORDER="#4caf50"; JOB3_BADGE_BG="#e8f5e9"; JOB3_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB3_ICON="❌"; JOB3_LABEL="Falhou";    JOB3_BORDER="#ef5350"; JOB3_BADGE_BG="#ffebee"; JOB3_BADGE_COLOR="#c62828" ;;
            skipped)   JOB3_ICON="⊘";  JOB3_LABEL="Pulado";    JOB3_BORDER="#bdbdbd"; JOB3_BADGE_BG="#f5f5f5"; JOB3_BADGE_COLOR="#757575" ;;
            *)         JOB3_ICON="⊘";  JOB3_LABEL="—";         JOB3_BORDER="#bdbdbd"; JOB3_BADGE_BG="#f5f5f5"; JOB3_BADGE_COLOR="#9e9e9e" ;;
          esac

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M (BRT)')
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_NUM="#${{ github.run_number }}"

          sed \
            -e "s|{{STATUS_ICON}}|${STATUS_ICON}|g" \
            -e "s|{{STATUS_BG}}|${STATUS_BG}|g" \
            -e "s|{{STATUS_BORDER}}|${STATUS_BORDER}|g" \
            -e "s|{{STATUS_TEXT}}|${STATUS_TEXT}|g" \
            -e "s|{{STATUS_LABEL}}|${STATUS_LABEL}|g" \
            -e "s|{{JOB1_ICON}}|${JOB1_ICON}|g" \
            -e "s|{{JOB1_LABEL}}|${JOB1_LABEL}|g" \
            -e "s|{{JOB1_BORDER}}|${JOB1_BORDER}|g" \
            -e "s|{{JOB1_BADGE_BG}}|${JOB1_BADGE_BG}|g" \
            -e "s|{{JOB1_BADGE_COLOR}}|${JOB1_BADGE_COLOR}|g" \
            -e "s|{{JOB2_ICON}}|${JOB2_ICON}|g" \
            -e "s|{{JOB2_LABEL}}|${JOB2_LABEL}|g" \
            -e "s|{{JOB2_BORDER}}|${JOB2_BORDER}|g" \
            -e "s|{{JOB2_BADGE_BG}}|${JOB2_BADGE_BG}|g" \
            -e "s|{{JOB2_BADGE_COLOR}}|${JOB2_BADGE_COLOR}|g" \
            -e "s|{{JOB3_ICON}}|${JOB3_ICON}|g" \
            -e "s|{{JOB3_LABEL}}|${JOB3_LABEL}|g" \
            -e "s|{{JOB3_BORDER}}|${JOB3_BORDER}|g" \
            -e "s|{{JOB3_BADGE_BG}}|${JOB3_BADGE_BG}|g" \
            -e "s|{{JOB3_BADGE_COLOR}}|${JOB3_BADGE_COLOR}|g" \
            -e "s|{{BRANCH}}|${{ github.ref_name }}|g" \
            -e "s|{{SHORT_SHA}}|${SHORT_SHA}|g" \
            -e "s|{{ACTOR}}|${{ github.actor }}|g" \
            -e "s|{{TIMESTAMP}}|${TIMESTAMP}|g" \
            -e "s|{{WORKFLOW_RUN}}|${RUN_NUM}|g" \
            -e "s|{{WORKFLOW_URL}}|${WORKFLOW_URL}|g" \
            .github/email-templates/deploy-notification.html > /tmp/email-body.html

          {
            echo 'html_body<<EMAILEOF'
            cat /tmp/email-body.html
            echo 'EMAILEOF'
          } >> "$GITHUB_OUTPUT"

      - name: 📬 Enviar e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.gen_html.outputs.subject_emoji }} Deploy PRD · ${{ github.ref_name }} · #${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: ${{ steps.gen_html.outputs.html_body }}
          convert_markdown: false

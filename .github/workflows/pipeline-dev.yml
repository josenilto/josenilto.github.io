# ══════════════════════════════════════════════════════════════════
#  Pipeline DEV — Testes de pacotes, links e Deploy para site DEV
#  Dispara em: push/PR para dev  |  manual (dispatch)
#
#  ATENÇÃO — Pré-requisitos:
#    1. Repositório josenilto-dev/josenilto-dev.github.io criado
#    2. GitHub Pages habilitado: Settings → Pages → Branch: gh-pages
#    3. Secret DEPLOY_TOKEN configurado neste repo com PAT que tem
#       permissão de escrita em josenilto-dev/josenilto-dev.github.io
#       (Scopes: repo  ou  contents: write no fine-grained token)
#
#  URL de resultado: https://josenilto-dev.github.io
# ══════════════════════════════════════════════════════════════════
name: 🛠️ Pipeline DEV — Testes & Deploy

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: 'Pular verificação de links? (true/false)'
        required: false
        default: 'false'

# DEV pode cancelar runs em andamento — iterações rápidas
concurrency:
  group: pipeline-dev-${{ github.ref }}
  cancel-in-progress: true

# ── Variáveis globais ───────────────────────────────────────────
env:
  NODE_VERSION: '20'
  DEPLOY_REPO: 'josenilto-dev/josenilto-dev.github.io' # repo externo de destino
  SITE_URL: 'https://josenilto-dev.github.io'           # URL pública do ambiente
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'            # obrigatório a partir de jun/2026

# ══════════════════════════════════════════════════════════════════
# JOB 1 — AUDITORIA DE PACOTES
#   • npm ci no diretório dev/
#   • npm audit --audit-level=moderate  (mais restrito que prd para pegar cedo)
#   • npm outdated                      → informativo (não bloqueia)
# ══════════════════════════════════════════════════════════════════
jobs:
  audit:
    name: 🔍 Auditoria de Pacotes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔒 Auditoria de segurança (moderate+ bloqueiam em DEV)
        run: npm audit --audit-level=moderate

      - name: 📋 Dependências desatualizadas (informativo)
        run: npm outdated || true

      - name: 📄 Resumo de auditoria
        if: always()
        run: |
          echo "## 🔍 Auditoria de Pacotes — DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | \`${{ env.NODE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Ambiente | \`dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Nível de auditoria | \`moderate\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pacotes instalados" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm list --depth=0 2>/dev/null | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — LINT + BUILD (modo development)
  #   • eslint no código React/TypeScript
  #   • vite build --mode development --base /dev/
  #   • base /dev/ garante que assets apontem para a subpasta correta
  #   • artefato salvo como dist-dev
  # ══════════════════════════════════════════════════════════════
  build:
    name: 🔨 Lint & Build (Vite dev mode)
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🧹 Lint (ESLint)
        run: npm run lint

      - name: 🏗️ Build modo desenvolvimento (base /)
        # --base / → site publicado na raiz de josenilto-dev.github.io
        run: npm run build:dev -- --base /
        env:
          NODE_ENV: development

      - name: 📊 Tamanho do build
        run: |
          echo "## 🏗️ Build DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Modo | \`development\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Base path | \`/\` (raiz — josenilto-dev.github.io) |" >> $GITHUB_STEP_SUMMARY
          echo "| Tamanho total | $(du -sh dist/ | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 Arquivos gerados" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/assets/ 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: dist-dev
          path: dev/dist/
          retention-days: 1   # DEV tem retenção mais curta

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — SMOKE TEST (dev server)
  #   • npm i         → instala dependências (inclui devDependencies)
  #   • npm run dev   → inicia servidor Vite em background (porta 5173)
  #   • Aguarda até 30s a porta ficar pronta (curl polling)
  #   • Health-check HTTP → aviso se não retornar 200
  #   • Processo encerrado automaticamente ao fim do job
  # ══════════════════════════════════════════════════════════════
  dev-server:
    name: 🧪 Smoke Test — Dev Server
    runs-on: ubuntu-latest
    needs: audit
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dev/package-lock.json

      # Step 3: Install the necessary dependencies.
      - name: 📦 Instalar dependências
        run: npm i

      # Step 4: Start the development server with auto-reloading and an instant preview.
      - name: 🚀 Iniciar servidor de desenvolvimento (background)
        run: npm run dev &
        env:
          NODE_ENV: development

      - name: ⏳ Aguardar servidor ficar pronto (porta 5173)
        run: |
          echo "Aguardando http://localhost:5173 ..."
          timeout 30 bash -c \
            'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done' \
            && echo "✅ Servidor respondendo" \
            || (echo "::error::Timeout — servidor não respondeu em 30s" && exit 1)

      - name: 🔍 Health-check HTTP
        id: health
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5173)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] \
            && echo "✅ HTTP 200 OK" \
            || echo "::warning::Dev server retornou HTTP $STATUS (esperado 200)"
        continue-on-error: true

      - name: 📋 Resumo do Smoke Test
        if: always()
        run: |
          echo "## 🧪 Smoke Test — Dev Server" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Servidor | \`http://localhost:5173\` |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Status | \`${{ steps.health.outputs.status || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | \`${{ env.NODE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Resultado | ${{ job.status == 'success' && '✅ Passou' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — VERIFICAÇÃO DE LINKS
  #   DEV é mais permissivo que PRD:
  #   • Links locais quebrados → ⚠️ aviso (não bloqueia deploy)
  #   • Links externos         → ⚠️ aviso (não bloqueia deploy)
  #   • Relatório salvo como artefato para análise
  # ══════════════════════════════════════════════════════════════
  link-check:
    name: 🔗 Verificação de Links
    runs-on: ubuntu-latest
    needs: [build, dev-server]
    if: github.event.inputs.skip_link_check != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artefato do build
        uses: actions/download-artifact@v4
        with:
          name: dist-dev
          path: dev/dist/

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Instalar linkinator
        run: npm install -g linkinator

      # ── 3a) Links locais — site estático ── Aviso em DEV ──
      - name: 🔗 Links locais — site estático
        id: local-static
        run: |
          echo "Verificando links locais em index.html..."
          linkinator ./index.html \
            --skip "^https?://" \
            --timeout 10000 \
            --verbosity error || echo "⚠️  Links locais quebrados detectados (não bloqueia DEV)"
        continue-on-error: true

      # ── 3b) Links externos — site estático ── Aviso em DEV ──
      - name: 🌐 Links externos — site estático
        id: external-static
        run: |
          echo "Verificando links externos em index.html..."
          linkinator ./index.html \
            --recurse \
            --skip "api\.whatsapp\.com|josenilto\.slack\.com|web\.telegram\.org|unpkg\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com" \
            --timeout 15000 \
            --retry-errors \
            --verbosity error || echo "⚠️  Alguns links externos podem estar temporariamente indisponíveis"
        continue-on-error: true

      # ── 3c) Links locais — build React DEV ── Aviso em DEV ──
      - name: 🔗 Links locais — build React
        id: local-react
        run: |
          echo "Verificando links locais em dev/dist/..."
          linkinator ./dev/dist/ \
            --recurse \
            --skip "^https?://" \
            --timeout 10000 \
            --verbosity error || echo "⚠️  Links locais quebrados no build React (não bloqueia DEV)"
        continue-on-error: true

      # ── 3d) Links externos — build React DEV ── Aviso em DEV ──
      - name: 🌐 Links externos — build React
        id: external-react
        run: |
          echo "Verificando links externos no build React..."
          linkinator ./dev/dist/ \
            --recurse \
            --timeout 15000 \
            --retry-errors \
            --verbosity error || echo "⚠️  Alguns links externos indisponíveis no build React"
        continue-on-error: true

      - name: 📄 Resumo de links
        if: always()
        run: |
          echo "## 🔗 Verificação de Links — DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ Em DEV todos os erros de link são **avisos** (não bloqueiam o deploy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Links locais — site estático | ${{ steps.local-static.outcome == 'success' && '✅ OK' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links externos — site estático | ${{ steps.external-static.outcome == 'success' && '✅ OK' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links locais — build React | ${{ steps.local-react.outcome == 'success' && '✅ OK' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links externos — build React | ${{ steps.external-react.outcome == 'success' && '✅ OK' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 6 — DEPLOY PARA josenilto-dev.github.io
  #   • Publica no repo externo josenilto-dev/josenilto-dev.github.io
  #   • Requer secret DEPLOY_TOKEN (PAT com escrita no repo externo)
  #   • Publica: site estático raiz + React app compilada em /app
  #   • Deploy automático (sem aprovação manual)
  # ══════════════════════════════════════════════════════════════
  deploy-dev:
    name: 🌐 Deploy → josenilto-dev.github.io
    runs-on: ubuntu-latest
    needs: [build, dev-server, link-check]
    # DEV sempre deploya: dev-server e link-check podem ter avisos
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.dev-server.result == 'success' ||
       needs.dev-server.result == 'failure') &&
      (needs.link-check.result == 'success' ||
       needs.link-check.result == 'skipped' ||
       needs.link-check.result == 'failure') &&
      (
        github.ref == 'refs/heads/dev' ||
        github.event_name == 'workflow_dispatch'
      )

    environment:
      name: dev
      url: ${{ env.SITE_URL }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔑 Verificar secret DEPLOY_TOKEN
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret DEPLOY_TOKEN não configurado."
            echo "Configure em: Settings → Secrets → Actions → New repository secret"
            echo "O token precisa ter permissão de escrita em ${{ env.DEPLOY_REPO }}"
            exit 1
          fi
          echo "✅ DEPLOY_TOKEN presente"
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Download artefato do build React
        uses: actions/download-artifact@v4
        with:
          name: dist-dev
          path: dev/dist/

      # ── Estrutura publicada na raiz de josenilto-dev.github.io ──
      # _site-dev/index.html → portfólio estático
      # _site-dev/assets/    → CSS, JS, imagens
      # _site-dev/app/       → React app compilada
      - name: 📁 Preparar pasta de publicação DEV
        run: |
          mkdir -p _site-dev/app

          cp index.html    _site-dev/
          cp -r assets/    _site-dev/assets/
          cp -r dev/dist/. _site-dev/app/

          echo "📂 Estrutura de publicação DEV:"
          find _site-dev -maxdepth 2 -type f | head -30

      - name: 🚀 Deploy para josenilto-dev.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ${{ env.DEPLOY_REPO }}
          publish_branch: gh-pages
          publish_dir: ./_site-dev
          commit_message: "deploy(dev): ${{ github.sha }} by @${{ github.actor }}"
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: 📋 Resumo do Deploy DEV
        run: |
          echo "## 🛠️ Deploy DEV Concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | [${{ env.SITE_URL }}](${{ env.SITE_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗂️ App React | [${{ env.SITE_URL }}/app](${{ env.SITE_URL }}/app) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Autor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗂️ Repo destino | \`${{ env.DEPLOY_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Data | $(date -u '+%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY

# ══════════════════════════════════════════════════════════════════
#  Pipeline DEV — Lovable Project (React/Vite/Tailwind/shadcn)
#  Dispara em: push/PR para dev  |  manual (dispatch)
#
#  Estrutura da branch dev:
#    raiz/          → Lovable project (package.json, src/, vite.config.ts)
#    Dockerfile     → multi-stage Node build + Nginx (porta 8081)
#    docker-compose.dev.yml → compose separado do prd/hmg
#
#  URL de resultado: https://josenilto.github.io/dev/
# ══════════════════════════════════════════════════════════════════
name: 🛠️ Pipeline DEV — Lovable Project

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      skip_link_check:
        description: 'Pular verificação de links? (true/false)'
        required: false
        default: 'false'

# DEV cancela runs em andamento — iterações rápidas
concurrency:
  group: pipeline-josenilto-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  SITE_URL: 'https://josenilto.github.io/dev'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# ══════════════════════════════════════════════════════════════════
# JOB 1 — AUDITORIA DE PACOTES
# ══════════════════════════════════════════════════════════════════
jobs:
  audit:
    name: 🔍 Auditoria de Pacotes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🔒 Auditoria de segurança (moderate+ — aviso em DEV)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 📋 Dependências desatualizadas (informativo)
        run: npm outdated || true

      - name: 📄 Resumo de auditoria
        if: always()
        run: |
          echo "## 🔍 Auditoria de Pacotes — Lovable DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | \`${{ env.NODE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL destino | \`${{ env.SITE_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | React + Vite + Tailwind + shadcn |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pacotes instalados" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm list --depth=0 2>/dev/null | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — LINT + BUILD
  #   • vite build (modo production, base /dev/ via vite.config.ts)
  #   • artefato: dist/
  # ══════════════════════════════════════════════════════════════
  build:
    name: 🔨 Lint & Build (Vite production)
    runs-on: ubuntu-latest
    needs: audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: 🧹 Lint (ESLint)
        run: npm run lint

      - name: 🏗️ Build produção (base /dev/ — vite.config.ts)
        run: npm run build

      - name: 📊 Tamanho do build
        run: |
          echo "## 🏗️ Build — Lovable DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Modo | \`production\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Base path | \`/dev/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | \`${{ env.SITE_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tamanho total | $(du -sh dist/ | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 Arquivos gerados" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/assets/ 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: dist-josenilto-dev
          path: dist/
          retention-days: 1

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — VERIFICAÇÃO DE LINKS (permissivo)
  #   Todos os erros são ⚠️ avisos — nunca bloqueiam o deploy
  # ══════════════════════════════════════════════════════════════
  link-check:
    name: 🔗 Verificação de Links
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.skip_link_check != 'true'

    steps:
      - name: Download artefato do build
        uses: actions/download-artifact@v4
        with:
          name: dist-josenilto-dev
          path: dist/

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Instalar linkinator
        run: npm install -g linkinator

      - name: 🔗 Links locais — build Lovable
        id: local-react
        run: |
          linkinator ./dist/ \
            --recurse \
            --skip "^https?://" \
            --timeout 10000 \
            --verbosity error || echo "⚠️  Links locais quebrados no build"
        continue-on-error: true

      - name: 🌐 Links externos — build Lovable
        id: external-react
        run: |
          linkinator ./dist/ \
            --recurse \
            --timeout 15000 \
            --retry-errors \
            --verbosity error || echo "⚠️  Links externos indisponíveis"
        continue-on-error: true

      - name: 📄 Resumo de links
        if: always()
        run: |
          echo "## 🔗 Verificação de Links — Lovable DEV" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ Em DEV todos os erros de link são **avisos** (não bloqueiam o deploy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Links locais — build | ${{ steps.local-react.outcome == 'success' && '✅ OK' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Links externos — build | ${{ steps.external-react.outcome == 'success' && '✅ OK' || '⚠️ Aviso' }} |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — DEPLOY PARA /dev (gh-pages)
  #   • dist/ → destination_dir: dev
  #   • URL: https://josenilto.github.io/dev/
  # ══════════════════════════════════════════════════════════════
  deploy-josenilto-dev:
    name: 🌐 Deploy → josenilto.github.io/dev
    runs-on: ubuntu-latest
    needs: [build, link-check]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.link-check.result == 'success' ||
       needs.link-check.result == 'skipped' ||
       needs.link-check.result == 'failure') &&
      (
        github.ref == 'refs/heads/dev' ||
        github.event_name == 'workflow_dispatch'
      )

    environment:
      name: dev
      url: ${{ env.SITE_URL }}

    permissions:
      contents: write

    steps:
      - name: Download artefato do build
        uses: actions/download-artifact@v4
        with:
          name: dist-josenilto-dev
          path: dist/

      - name: 📁 Estrutura de publicação
        run: |
          echo "📂 Arquivos a publicar em /dev:"
          find dist/ -maxdepth 3 -type f | head -30

      - name: 🚀 Deploy → /dev (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token:    ${{ secrets.GITHUB_TOKEN }}
          publish_dir:     ./dist
          destination_dir: dev
          keep_files:      true
          enable_jekyll:   false
          commit_message:  "deploy(dev): ${{ github.sha }} by @${{ github.actor }}"
          user_name:  "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: 📋 Resumo do Deploy DEV
        run: |
          echo "## 🛠️ Deploy DEV Concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | [${{ env.SITE_URL }}](${{ env.SITE_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Autor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🕐 Data | $(date -u '+%d/%m/%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — HEALTH CHECK PÓS-DEPLOY (DEV)
  #   Verifica se a SPA respondeu HTTP 200 em /dev/
  # ══════════════════════════════════════════════════════════════
  health-check:
    name: 🏥 Health Check Pós-Deploy
    runs-on: ubuntu-latest
    needs: deploy-josenilto-dev
    if: needs.deploy-josenilto-dev.result == 'success'
    timeout-minutes: 6

    steps:
      - name: ⏳ Aguardar propagação do GitHub Pages
        run: sleep 60

      - name: 🔍 Verificar SPA (/dev/)
        run: |
          URL="${{ env.SITE_URL }}/"
          for i in 1 2 3 4 5; do
            echo "🔄 Tentativa ${i}/5 → ${URL}"
            STATUS=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            echo "   HTTP ${STATUS}"
            if [ "$STATUS" = "200" ]; then echo "✅ OK!"; exit 0; fi
            [ "$i" -lt 5 ] && sleep 20
          done
          echo "❌ Health check falhou"; exit 1

      - name: 📋 Resumo
        if: always()
        run: |
          echo "## 🏥 Health Check — DEV" >> $GITHUB_STEP_SUMMARY
          echo "| URL | \`${{ env.SITE_URL }}/\` |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 6 — NOTIFICAÇÃO POR E-MAIL (DEV)
  # ══════════════════════════════════════════════════════════════
  notify-email:
    name: 📧 Notificação por E-mail
    runs-on: ubuntu-latest
    needs: [audit, build, deploy-josenilto-dev, health-check]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout (template de e-mail — branch prd)
        uses: actions/checkout@v4
        with:
          ref: prd

      - name: 🎨 Gerar template HTML
        id: gen_html
        run: |
          AUDIT_RESULT="${{ needs.audit.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          DEPLOY_RESULT="${{ needs.deploy-josenilto-dev.result }}"
          HEALTH_RESULT="${{ needs.health-check.result }}"

          if [ "$DEPLOY_RESULT" = "success" ] && [ "$HEALTH_RESULT" = "success" ]; then
            STATUS_ICON="✅"; STATUS_BG="#e8f5e9"; STATUS_BORDER="#4caf50"
            STATUS_TEXT="#1b5e20"; STATUS_LABEL="Deploy DEV Concluído com Sucesso"; SUBJECT_EMOJI="✅"
          elif [ "$HEALTH_RESULT" = "failure" ]; then
            STATUS_ICON="⚠️"; STATUS_BG="#fff3e0"; STATUS_BORDER="#ff9800"
            STATUS_TEXT="#e65100"; STATUS_LABEL="Health Check Falhou — Verificar DEV"; SUBJECT_EMOJI="⚠️"
          else
            STATUS_ICON="❌"; STATUS_BG="#ffebee"; STATUS_BORDER="#ef5350"
            STATUS_TEXT="#b71c1c"; STATUS_LABEL="Falha no Deploy DEV"; SUBJECT_EMOJI="❌"
          fi
          echo "subject_emoji=${SUBJECT_EMOJI}" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_RESULT" = "failure" ] || [ "$AUDIT_RESULT" = "failure" ]; then
            JOB1_ICON="❌"; JOB1_LABEL="Falhou";  JOB1_BORDER="#ef5350"; JOB1_BADGE_BG="#ffebee"; JOB1_BADGE_COLOR="#c62828"
          elif [ "$BUILD_RESULT" = "success" ]; then
            JOB1_ICON="✅"; JOB1_LABEL="Sucesso"; JOB1_BORDER="#4caf50"; JOB1_BADGE_BG="#e8f5e9"; JOB1_BADGE_COLOR="#2e7d32"
          else
            JOB1_ICON="⊘";  JOB1_LABEL="—";       JOB1_BORDER="#bdbdbd"; JOB1_BADGE_BG="#f5f5f5"; JOB1_BADGE_COLOR="#9e9e9e"
          fi

          case "$DEPLOY_RESULT" in
            success)   JOB2_ICON="✅"; JOB2_LABEL="Sucesso"; JOB2_BORDER="#4caf50"; JOB2_BADGE_BG="#e8f5e9"; JOB2_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB2_ICON="❌"; JOB2_LABEL="Falhou";  JOB2_BORDER="#ef5350"; JOB2_BADGE_BG="#ffebee"; JOB2_BADGE_COLOR="#c62828" ;;
            skipped)   JOB2_ICON="⊘";  JOB2_LABEL="Pulado";  JOB2_BORDER="#bdbdbd"; JOB2_BADGE_BG="#f5f5f5"; JOB2_BADGE_COLOR="#757575" ;;
            *)         JOB2_ICON="⊘";  JOB2_LABEL="—";       JOB2_BORDER="#bdbdbd"; JOB2_BADGE_BG="#f5f5f5"; JOB2_BADGE_COLOR="#9e9e9e" ;;
          esac
          case "$HEALTH_RESULT" in
            success)   JOB3_ICON="✅"; JOB3_LABEL="Saudável"; JOB3_BORDER="#4caf50"; JOB3_BADGE_BG="#e8f5e9"; JOB3_BADGE_COLOR="#2e7d32" ;;
            failure)   JOB3_ICON="❌"; JOB3_LABEL="Falhou";   JOB3_BORDER="#ef5350"; JOB3_BADGE_BG="#ffebee"; JOB3_BADGE_COLOR="#c62828" ;;
            skipped)   JOB3_ICON="⊘";  JOB3_LABEL="Pulado";   JOB3_BORDER="#bdbdbd"; JOB3_BADGE_BG="#f5f5f5"; JOB3_BADGE_COLOR="#757575" ;;
            *)         JOB3_ICON="⊘";  JOB3_LABEL="—";        JOB3_BORDER="#bdbdbd"; JOB3_BADGE_BG="#f5f5f5"; JOB3_BADGE_COLOR="#9e9e9e" ;;
          esac

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y às %H:%M (BRT)')
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          sed \
            -e "s|{{PIPELINE_TITLE}}|Pipeline DEV — Lovable|g" \
            -e "s|{{ENV_LABEL}}|josenilto.github.io/dev · Lovable|g" \
            -e "s|{{ENV_URL}}|${{ env.SITE_URL }}|g" \
            -e "s|{{ENV_BTN_LABEL}}|Ver Site DEV|g" \
            -e "s|{{JOB1_NAME}}|🔨\&nbsp; Auditoria + Build|g" \
            -e "s|{{JOB2_NAME}}|🚀\&nbsp; Deploy DEV|g" \
            -e "s|{{JOB3_NAME}}|🏥\&nbsp; Health Check|g" \
            -e "s|{{STATUS_ICON}}|${STATUS_ICON}|g" \
            -e "s|{{STATUS_BG}}|${STATUS_BG}|g" \
            -e "s|{{STATUS_BORDER}}|${STATUS_BORDER}|g" \
            -e "s|{{STATUS_TEXT}}|${STATUS_TEXT}|g" \
            -e "s|{{STATUS_LABEL}}|${STATUS_LABEL}|g" \
            -e "s|{{JOB1_ICON}}|${JOB1_ICON}|g" \
            -e "s|{{JOB1_LABEL}}|${JOB1_LABEL}|g" \
            -e "s|{{JOB1_BORDER}}|${JOB1_BORDER}|g" \
            -e "s|{{JOB1_BADGE_BG}}|${JOB1_BADGE_BG}|g" \
            -e "s|{{JOB1_BADGE_COLOR}}|${JOB1_BADGE_COLOR}|g" \
            -e "s|{{JOB2_ICON}}|${JOB2_ICON}|g" \
            -e "s|{{JOB2_LABEL}}|${JOB2_LABEL}|g" \
            -e "s|{{JOB2_BORDER}}|${JOB2_BORDER}|g" \
            -e "s|{{JOB2_BADGE_BG}}|${JOB2_BADGE_BG}|g" \
            -e "s|{{JOB2_BADGE_COLOR}}|${JOB2_BADGE_COLOR}|g" \
            -e "s|{{JOB3_ICON}}|${JOB3_ICON}|g" \
            -e "s|{{JOB3_LABEL}}|${JOB3_LABEL}|g" \
            -e "s|{{JOB3_BORDER}}|${JOB3_BORDER}|g" \
            -e "s|{{JOB3_BADGE_BG}}|${JOB3_BADGE_BG}|g" \
            -e "s|{{JOB3_BADGE_COLOR}}|${JOB3_BADGE_COLOR}|g" \
            -e "s|{{BRANCH}}|${{ github.ref_name }}|g" \
            -e "s|{{SHORT_SHA}}|${SHORT_SHA}|g" \
            -e "s|{{ACTOR}}|${{ github.actor }}|g" \
            -e "s|{{TIMESTAMP}}|${TIMESTAMP}|g" \
            -e "s|{{WORKFLOW_RUN}}|#${{ github.run_number }}|g" \
            -e "s|{{WORKFLOW_URL}}|${WORKFLOW_URL}|g" \
            .github/email-templates/deploy-notification.html > /tmp/email-body.html

          { echo 'html_body<<EMAILEOF'; cat /tmp/email-body.html; echo 'EMAILEOF'; } >> "$GITHUB_OUTPUT"

      - name: 📬 Enviar e-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.gen_html.outputs.subject_emoji }} Deploy DEV · ${{ github.ref_name }} · #${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: ${{ steps.gen_html.outputs.html_body }}
          convert_markdown: false

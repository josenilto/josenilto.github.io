name: CI/CD PipeLines
on:
  workflow_dispatch:

# Força todas as actions a rodarem com Node.js 24 (obrigatório a partir de jun/2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run a one-line script
        run: echo Hello, world!


  deploy-dev:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: 'https://josenilto.github.io/dev'
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Deploy Dev
      run: echo "Deploy Dev finalizado!"


  deploy-hmg:
    runs-on: ubuntu-latest
    environment:
      name: hmg
      url: 'https://josenilto.github.io/hmg'
    needs: deploy-dev
    steps:
      - name: Run a one-line script
        run: echo Deploy HMG


  deploy-prd:
    runs-on: ubuntu-latest
    environment:
      name: prd
      url: 'https://josenilto.github.io'
    needs: deploy-hmg
    steps:
      - name: Run a one-line script
        run: echo Deploy PRD

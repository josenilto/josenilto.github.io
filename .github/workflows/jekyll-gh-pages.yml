# ⚠️  DEPRECATED — Substituído por pipeline-prd.yml
# Este workflow foi desativado para evitar conflito de deploy no GitHub Pages.
# Use o workflow "🚀 Pipeline PRD — Testes & Deploy" em seu lugar.
name: "[DEPRECATED] Deploy Jekyll with GitHub Pages"

on:
  # Desativado: push automático removido para evitar conflito com pipeline-prd.yml
  # push:
  #   branches: ["prd"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Este workflow está DEPRECATED. Use pipeline-prd.yml'
        required: true
        default: 'cancelar'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Força todas as actions a rodarem com Node.js 24 (obrigatório a partir de jun/2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

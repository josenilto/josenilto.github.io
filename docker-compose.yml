services:

  # ── Site estático (Nginx) ──────────────────────────────────────
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: josenilto/portfolio:local
    container_name: portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - internal

    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN

    security_opt:
      - no-new-privileges:true

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API REST + SQLite ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: josenilto/portfolio-api:local
    container_name: portfolio-api
    restart: unless-stopped
    networks:
      - internal

    volumes:
      # Bind mount para path fixo no host — persiste entre deploys, rebuilds
      # e mesmo que o ambiente Docker seja recriado do zero.
      # DATA_DIR pode ser definido no .env (padrão: ./data ao lado do compose)
      - ${DATA_DIR:-./data}:/data

    environment:
      PORT: 3000
      DB_PATH: /data/portfolio.db
      API_SECRET_KEY: ${API_SECRET_KEY:-}

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Rede interna (nginx ↔ api sem expor porta da api) ─────────────
networks:
  internal:
    driver: bridge

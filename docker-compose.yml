services:

  # ── Site estático (Nginx) ──────────────────────────────────────
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: josenilto/portfolio:local
    container_name: portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - internal

    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN

    security_opt:
      - no-new-privileges:true

    # service_started: nginx inicia assim que o container api sobe,
    # sem esperar o healthcheck passar. Requests /api/* retornam 502
    # enquanto a api inicializa, sem bloquear o nginx.
    depends_on:
      api:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API REST + SQLite ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: josenilto/portfolio-api:local
    container_name: portfolio-api
    restart: unless-stopped
    networks:
      - internal

    volumes:
      # Bind mount para path fixo no host — persiste entre deploys.
      # Docker cria ./data como root; o entrypoint.sh corrige o chown.
      - ${DATA_DIR:-./data}:/data

    environment:
      PORT: 3000
      DB_PATH: /data/portfolio.db
      API_SECRET_KEY: ${API_SECRET_KEY:-}

    cap_drop:
      - ALL
    cap_add:
      - CHOWN      # necessário para chown /data no entrypoint

    security_opt:
      - no-new-privileges:false   # entrypoint precisa de chown (root → node)

    # api NÃO é read_only: precisa escrever no banco SQLite em /data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

# ── Rede interna (nginx ↔ api sem expor porta da api) ─────────────
networks:
  internal:
    driver: bridge

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: josenilto/portfolio:local
    container_name: portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

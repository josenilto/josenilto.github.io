server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # ── Compressão ───────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Headers de segurança ─────────────────────────────────────
    add_header X-Frame-Options                   "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options            "nosniff"                             always;
    add_header Referrer-Policy                   "strict-origin-when-cross-origin"     always;
    add_header X-Permitted-Cross-Domain-Policies "none"                                always;
    add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy                "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy           "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Health-check ─────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Cache: assets com hash (Vite gera hashes no nome do arquivo) ──
    location ~* \.(js|css|woff2?|ttf|eot|svg|webp|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA: todas as rotas caem no index.html (client-side routing) ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}

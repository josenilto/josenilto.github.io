server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compressão ───────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Headers de segurança ─────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options "nosniff"                             always;
    add_header X-XSS-Protection       "1; mode=block"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"     always;

    # HSTS — força HTTPS por 1 ano (incluindo subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Permissions-Policy — desativa APIs não utilizadas
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP — permite CDNs usadas pelo portfólio (Boxicons, FontAwesome, AOS, Google Fonts)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline'
                    https://cdn.jsdelivr.net
                    https://cdnjs.cloudflare.com
                    https://unpkg.com;
        style-src   'self' 'unsafe-inline'
                    https://cdn.jsdelivr.net
                    https://cdnjs.cloudflare.com
                    https://unpkg.com
                    https://fonts.googleapis.com;
        font-src    'self' data:
                    https://cdn.jsdelivr.net
                    https://cdnjs.cloudflare.com
                    https://fonts.gstatic.com;
        img-src     'self' data: https:;
        connect-src 'self';
        frame-src   'none';
        object-src  'none';
        base-uri    'self';
        form-action 'self';
    " always;

    # ── Health-check (usado pelo HEALTHCHECK do Docker) ──────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── React app (SPA) em /app/ ─────────────────────────────────
    location /app/ {
        try_files $uri $uri/ /app/index.html;

        # Cache imutável para assets com hash no nome (Vite)
        location ~* /app/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Site estático (portfólio principal) ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    # ── Página 404 ───────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Oculta versão do nginx em respostas de erro e headers Server:
    server_tokens off;

    # ── Compressão ───────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Headers de segurança ─────────────────────────────────────
    # IMPORTANTE: add_header em location blocks NÃO herda do server block.
    # Todos os security headers ficam aqui; location blocks usam apenas
    # a diretiva `expires` (que não anula a herança de add_header).
    add_header X-Frame-Options                   "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options            "nosniff"                             always;
add_header Referrer-Policy                   "strict-origin-when-cross-origin"     always;
    add_header X-Permitted-Cross-Domain-Policies "none"                                always;
    add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy                "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy           "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Health-check (Docker + smoke test) ───────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Métricas do container (CPU + RAM) — geradas pelo entrypoint ─
    # entrypoint.sh escreve /tmp/metrics.json a cada ~5 s.
    # root /tmp → nginx resolve /tmp + /metrics.json = /tmp/metrics.json
    location = /metrics.json {
        root       /tmp;
        access_log off;
        expires    -1;
    }

    # ── Cache por tipo de arquivo ─────────────────────────────────
    # Apenas `expires` — sem add_header Cache-Control para preservar
    # a herança dos security headers definidos no bloco server.

    # HTML → sem cache (atualizações imediatas)
    location ~* \.html$ {
        expires -1;
    }

    # JS e CSS → 1 ano (assets do portfólio)
    location ~* \.(js|css)$ {
        expires 1y;
    }

    # Mídia e fontes → 30 dias
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
    }

    # ── Site estático ─────────────────────────────────────────────
    # =404 em vez de /index.html: site estático não usa client-side routing.
    # Rotas desconhecidas retornam 404 e exibem a página customizada.
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Página 404 customizada ───────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
